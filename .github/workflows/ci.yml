name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The real gate. The workspace has no external services, no network
  # access, and no platform-specific code, so a green test run here means
  # the same thing it means locally.
  test:
    name: build + test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --workspace --all-targets

      - run: cargo test --workspace

  # Style is reported, not enforced. The tree is not currently rustfmt-clean
  # and clippy has open lints; making either a hard gate today would turn
  # every PR red for reasons unrelated to the change under review. Promote
  # these to blocking once the backlog is cleared.
  style:
    name: fmt + clippy (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        continue-on-error: true
        run: cargo fmt --all --check

      - name: clippy
        continue-on-error: true
        env:
          RUSTFLAGS: ""
        run: cargo clippy --workspace --all-targets

  # Licence / advisory / source policy over the dependency graph. qana's
  # graph is deliberately tiny — the toolchain crates have zero external
  # dependencies — and this is what keeps it that way rather than merely
  # hoping. Config in deny.toml.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Contributions are DCO sign-off only, no CLA (see CONTRIBUTING.md), so
  # the sign-off trailer is the only record that a contributor asserted the
  # right to submit under MIT OR Apache-2.0. It has to be enforced.
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: tim-actions/get-pr-commits@v1.3.1
        id: get-pr-commits
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: tim-actions/dco@v1.1.0
        with:
          commits: ${{ steps.get-pr-commits.outputs.commits }}

[package]
name = "linework"
# NOT `version.workspace = true`. linework is engine-neutral and has no
# dependency on qana; an editor adopting it should not see qana's release
# cadence in its version number, and a qana release should not bump a
# protocol that did not change. It versions on its own schedule.
version = "0.0.3"
authors.workspace = true
edition.workspace = true
license.workspace = true
# Restored at 0.0.2. It was deliberately absent from 0.0.1, when
# github.com/mgraves/qana was still private and the link would have
# 404'd for everyone — a dead repository link on a crate you are asking
# people to build on reads as abandoned. The repo is public now, so the
# link resolves. Metadata is per-version, which is why this needed a
# release rather than an edit.
repository.workspace = true
documentation = "https://docs.rs/linework"
description = "The linework protocol: line-keyed, two-wave code paint and facts — engine-neutral types and the Limner trait binding language intelligence to editors"
readme = "README.md"
keywords = ["editor", "syntax-highlighting", "protocol", "lsp", "incremental"]
categories = ["text-editors", "development-tools"]

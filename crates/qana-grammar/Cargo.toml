[package]
name = "qana-grammar"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Grammar as a plain value: pattern-to-DFA compilation, canonical LR(1) tables with conflict counterexamples, and the envelope lints that make incremental parsing provable rather than hoped for"
readme = "README.md"
keywords = ["parser", "grammar", "lr", "dfa", "lexer"]
categories = ["parsing", "development-tools"]

[dependencies]
# One dependency, deliberately: serde. A certified grammar is an artifact
# — certified once (in a worker, in an earlier run) and loaded from bytes
# wherever it is used — and serde is how its values say what they are
# made of, in whatever encoding the host chooses. Nothing else.
serde = { version = "1", features = ["derive"] }

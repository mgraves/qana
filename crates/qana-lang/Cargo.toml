[package]
name = "qana-lang"
# Versioned independently of the workspace line (the linework
# precedent): 0.0.3 carries the LiveDoc canonical-line-term fix while
# the rest of the family stays 0.0.2.
version = "0.0.3"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The .qana grammar language: one file declares tokens, syntax, precedence, highlighting, outline and name binding — self-hosted on the qana engine"
readme = "README.md"
keywords = ["grammar", "dsl", "parser", "language", "codegen"]
categories = ["parsing", "development-tools"]

[dependencies]
qana-grammar.workspace = true
qana-engine.workspace = true
qana-services.workspace = true
qana-sem.workspace = true
linework.workspace = true

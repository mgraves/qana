[package]
name = "qana-lang"
# Versioned independently of the workspace line (the linework
# precedent): 0.0.3 carried the LiveDoc canonical-line-term fix;
# 0.0.4 carries the marks channel (linework 0.0.3) and rides the
# identity-cached overlay; 0.0.5 rides outline-by-delegation
# (qana-services 0.0.4) and fills OutlineConfig.defs at compile.
version = "0.0.5"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The .qana grammar language: one file declares tokens, syntax, precedence, highlighting, outline and name binding — self-hosted on the qana engine"
readme = "README.md"
keywords = ["grammar", "dsl", "parser", "language", "codegen"]
categories = ["parsing", "development-tools"]

[dependencies]
qana-grammar.workspace = true
qana-engine.workspace = true
qana-services.workspace = true
qana-sem.workspace = true
linework.workspace = true
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# The encoding a host keeps grammar artifacts in; the tests round-trip
# them through it. Without its default `heapless-cas` feature: nothing
# here uses heapless, and through it the graph would reach
# atomic-polyfill, which is unmaintained (RUSTSEC-2023-0089, refused by
# deny.toml).
postcard = { version = "1", default-features = false, features = ["alloc"] }

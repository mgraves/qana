[package]
name = "qana-lsp"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "P3: LSP server over the qana incremental toolchain, with live grammar-config hot-reload"

[dependencies]
qana-grammar = { path = "../qana-grammar" }
qana-engine = { path = "../qana-engine" }
qana-services = { path = "../qana-services" }
qana-sem = { path = "../qana-sem" }
qana-lang = { path = "../qana-lang" }
serde_json = "1"

[[bin]]
name = "qana-lsp"
path = "src/main.rs"

[package]
name = "qana-lsp"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Language server over the qana toolchain, with live grammar hot-reload: edit the .qana file and the language it defines updates in the editor immediately"
readme = "README.md"
keywords = ["lsp", "language-server", "editor", "grammar", "ide"]
categories = ["text-editors", "development-tools"]

[dependencies]
qana-grammar.workspace = true
qana-engine.workspace = true
qana-services.workspace = true
qana-sem.workspace = true
qana-lang.workspace = true
serde_json = "1"

[[bin]]
name = "qana-lsp"
path = "src/main.rs"

[package]
name = "qana-sem"
# Versioned independently of the workspace line (the linework
# precedent): 0.0.3 adds the identity-keyed paint view — uid-carrying
# fragments/resolutions, paint_sync, item_paint, has_types.
version = "0.0.3"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Semantic layer for qana grammars: declarative name binding, a declared type tier, macro expansion, and revisioned queries with signature firewalls"
readme = "README.md"
keywords = ["semantic", "binding", "types", "macros", "incremental"]
categories = ["parsing", "development-tools"]

[dependencies]
qana-grammar.workspace = true
qana-engine.workspace = true

[[bin]]
name = "p4bench"
path = "src/bin/p4bench.rs"

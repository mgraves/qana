[package]
name = "qana-services"
# Versioned independently of the workspace line (the linework
# precedent): 0.0.3 is the identity-cached overlay — keystroke paint
# cost O(window + changed items), independent of document size.
version = "0.0.3"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Editor services derived from a grammar: semantic tokens with LSP deltas, folding, outline, completion from parser ACTION rows, and diagnostics from parse repairs"
readme = "README.md"
keywords = ["lsp", "editor", "completion", "folding", "highlighting"]
categories = ["text-editors", "development-tools"]

[dependencies]
qana-grammar.workspace = true
qana-engine.workspace = true
qana-sem.workspace = true
linework.workspace = true

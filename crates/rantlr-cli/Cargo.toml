[package]
name = "rantlr-cli"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "The `rantlr` command: certify a .rg grammar and inspect every layer it derives — lex, parse, services, incremental reparse, exports"

[[bin]]
name = "rantlr"
path = "src/main.rs"

[dependencies]
rantlr-rg = { path = "../rantlr-rg" }
rantlr-grammar = { path = "../rantlr-grammar" }
rantlr-engine = { path = "../rantlr-engine" }
rantlr-services = { path = "../rantlr-services" }
rantlr-sem = { path = "../rantlr-sem" }

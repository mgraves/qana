[package]
name = "rantlr-engine"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "P1: generic incremental line-lexing engine + block skeleton, parameterized by compiled grammars"

[dependencies]
rantlr-grammar = { path = "../rantlr-grammar" }

[dev-dependencies]
rantlr-lex = { path = "../rantlr-lex" }

[[bin]]
name = "p1bench"
path = "src/bin/p1bench.rs"

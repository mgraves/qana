[package]
name = "rantlr-lsp"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "P3: LSP server over the rantlr incremental toolchain, with live grammar-config hot-reload"

[dependencies]
rantlr-grammar = { path = "../rantlr-grammar" }
rantlr-engine = { path = "../rantlr-engine" }
rantlr-services = { path = "../rantlr-services" }
rantlr-sem = { path = "../rantlr-sem" }
serde_json = "1"

[[bin]]
name = "rantlr-lsp"
path = "src/main.rs"
